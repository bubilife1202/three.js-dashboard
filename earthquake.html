<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Global Earthquake Monitor - 실시간 지진 3D 지구</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #000000, #0a0a1a);
            color: #ffffff;
        }

        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #controlPanel {
            width: 350px;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
            z-index: 100;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #FF4500;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .subtitle {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #FF6347;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: rgba(255, 69, 0, 0.1);
            border: 1px solid rgba(255, 69, 0, 0.3);
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #FF4500;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .earthquake-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
            border-left: 3px solid;
            font-size: 12px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .earthquake-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(3px);
        }

        .eq-magnitude {
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            width: 50px;
        }

        .eq-location {
            font-size: 11px;
            opacity: 0.9;
            margin-top: 3px;
        }

        .eq-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 3px;
        }

        .magnitude-7 { border-left-color: #8B0000; background: rgba(139, 0, 0, 0.2); }
        .magnitude-6 { border-left-color: #FF0000; background: rgba(255, 0, 0, 0.15); }
        .magnitude-5 { border-left-color: #FF4500; background: rgba(255, 69, 0, 0.1); }
        .magnitude-4 { border-left-color: #FFA500; background: rgba(255, 165, 0, 0.08); }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .legend-color {
            width: 30px;
            height: 15px;
            border-radius: 3px;
        }

        .control-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid rgba(255, 69, 0, 0.3);
            background: rgba(255, 69, 0, 0.2);
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-size: 13px;
        }

        .control-btn:hover {
            background: rgba(255, 69, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.3);
        }

        .filter-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-size: 11px;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: rgba(255, 69, 0, 0.3);
            border-color: #FF4500;
        }

        #loadingIndicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 69, 0, 0.2);
            border: 1px solid rgba(255, 69, 0, 0.5);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 200;
            display: none;
        }

        #loadingIndicator.show {
            display: block;
        }

        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 15px;
            border-radius: 5px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            font-size: 12px;
            border: 1px solid rgba(255, 69, 0, 0.5);
            max-width: 250px;
        }

        .tooltip-magnitude {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .ring-of-fire {
            color: #FF4500;
            font-weight: bold;
        }

        #controlPanel::-webkit-scrollbar {
            width: 6px;
        }

        #controlPanel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #controlPanel::-webkit-scrollbar-thumb {
            background: rgba(255, 69, 0, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controlPanel">
            <h1>🌍 Global Earthquake Monitor</h1>
            <div class="subtitle">실시간 세계 지진 3D 시각화</div>

            <div class="section">
                <div class="section-title">통계 (최근 7일)</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-number" id="totalCount">-</div>
                        <div class="stat-label">총 지진 수</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="maxMagnitude">-</div>
                        <div class="stat-label">최대 규모</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="todayCount">-</div>
                        <div class="stat-label">오늘</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="majorCount">-</div>
                        <div class="stat-label">규모 6.0+</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">필터</div>
                <div class="filter-group">
                    <button class="filter-btn active" data-period="hour">1시간</button>
                    <button class="filter-btn active" data-period="day">1일</button>
                    <button class="filter-btn active" data-period="week">1주일</button>
                </div>
                <div class="filter-group" style="margin-top: 5px;">
                    <button class="filter-btn active" data-mag="4">4.5+</button>
                    <button class="filter-btn active" data-mag="5">5.0+</button>
                    <button class="filter-btn active" data-mag="6">6.0+</button>
                    <button class="filter-btn active" data-mag="7">7.0+</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">최근 지진 TOP 10</div>
                <div id="recentEarthquakes"></div>
            </div>

            <div class="section">
                <div class="section-title">범례</div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FF0000;"></div>
                        <span>최근 1시간 (붉은색)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FFA500;"></div>
                        <span>최근 1일 (주황색)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FFFF00;"></div>
                        <span>최근 1주일 (노란색)</span>
                    </div>
                    <div class="legend-item">
                        <span style="font-size: 20px;">💥</span>
                        <span>크기 = 지진 규모</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">컨트롤</div>
                <button class="control-btn" id="refreshBtn">🔄 데이터 새로고침</button>
                <button class="control-btn" id="pauseBtn">⏸ 회전 일시정지</button>
                <button class="control-btn" id="resetBtn">🔄 카메라 리셋</button>
            </div>

            <div class="section">
                <div class="section-title">정보</div>
                <div style="font-size: 11px; opacity: 0.7; line-height: 1.6;">
                    <p><span class="ring-of-fire">환태평양 화산대 (Ring of Fire)</span>에서 전 세계 지진의 약 90%가 발생합니다.</p>
                    <p style="margin-top: 10px;">데이터 출처: USGS (미국 지질조사국)</p>
                    <p>업데이트: 5분마다 자동</p>
                    <p>비용: 100% 무료</p>
                </div>
            </div>
        </div>

        <div id="canvas-container">
            <div id="loadingIndicator">🔄 Loading...</div>
            <div id="tooltip"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        let scene, camera, renderer, controls;
        let earth, earthquakes = [];
        let isPaused = false;
        let animationTime = 0;
        let raycaster, mouse;
        let earthquakeData = [];

        // Filter states
        let activeFilters = {
            periods: new Set(['hour', 'day', 'week']),
            magnitudes: new Set(['4', '5', '6', '7'])
        };

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Camera
            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(
                60,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 150);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 60;
            controls.maxDistance = 300;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1.5, 300);
            pointLight.position.set(100, 100, 100);
            scene.add(pointLight);

            // Create Earth
            createEarth();

            // Create starfield
            createStarfield();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('click', onClick);

            // UI setup
            setupUI();

            // Fetch earthquake data
            fetchEarthquakeData();

            // Auto-refresh every 5 minutes
            setInterval(fetchEarthquakeData, 5 * 60 * 1000);

            // Animation loop
            animate();
        }

        function createEarth() {
            const geometry = new THREE.SphereGeometry(50, 64, 64);

            // Earth texture (simple color for now)
            const material = new THREE.MeshPhongMaterial({
                color: 0x1a4d2e,
                emissive: 0x0a1f16,
                shininess: 5,
                transparent: true,
                opacity: 0.9
            });

            earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            // Add atmosphere glow
            const atmosphereGeometry = new THREE.SphereGeometry(52, 64, 64);
            const atmosphereMaterial = new THREE.MeshPhongMaterial({
                color: 0x4a90e2,
                transparent: true,
                opacity: 0.1,
                side: THREE.BackSide
            });
            const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            earth.add(atmosphere);

            // Add grid lines
            const gridMaterial = new THREE.LineBasicMaterial({
                color: 0x3a7a5a,
                transparent: true,
                opacity: 0.3
            });

            // Latitude lines
            for (let i = -80; i <= 80; i += 20) {
                const phi = (90 - i) * Math.PI / 180;
                const points = [];
                for (let j = 0; j <= 360; j += 10) {
                    const theta = j * Math.PI / 180;
                    const x = 50.5 * Math.sin(phi) * Math.cos(theta);
                    const y = 50.5 * Math.cos(phi);
                    const z = 50.5 * Math.sin(phi) * Math.sin(theta);
                    points.push(new THREE.Vector3(x, y, z));
                }
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeometry, gridMaterial);
                earth.add(line);
            }

            // Longitude lines
            for (let i = 0; i < 360; i += 30) {
                const points = [];
                for (let j = -90; j <= 90; j += 5) {
                    const phi = (90 - j) * Math.PI / 180;
                    const theta = i * Math.PI / 180;
                    const x = 50.5 * Math.sin(phi) * Math.cos(theta);
                    const y = 50.5 * Math.cos(phi);
                    const z = 50.5 * Math.sin(phi) * Math.sin(theta);
                    points.push(new THREE.Vector3(x, y, z));
                }
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeometry, gridMaterial);
                earth.add(line);
            }
        }

        function createStarfield() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.7,
                transparent: true,
                opacity: 0.8
            });

            const starsVertices = [];
            for (let i = 0; i < 3000; i++) {
                const x = (Math.random() - 0.5) * 1000;
                const y = (Math.random() - 0.5) * 1000;
                const z = (Math.random() - 0.5) * 1000;
                starsVertices.push(x, y, z);
            }

            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        // Convert lat/lon to 3D position on sphere
        function latLonToVector3(lat, lon, radius = 50) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = (lon + 180) * Math.PI / 180;

            const x = -radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            return new THREE.Vector3(x, y, z);
        }

        async function fetchEarthquakeData() {
            const loading = document.getElementById('loadingIndicator');
            loading.classList.add('show');

            try {
                // Fetch last 7 days, magnitude 4.5+
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson');
                const data = await response.json();

                earthquakeData = data.features.map(feature => ({
                    magnitude: feature.properties.mag,
                    place: feature.properties.place,
                    time: new Date(feature.properties.time),
                    lat: feature.geometry.coordinates[1],
                    lon: feature.geometry.coordinates[0],
                    depth: feature.geometry.coordinates[2],
                    id: feature.id
                }));

                // Sort by magnitude
                earthquakeData.sort((a, b) => b.magnitude - a.magnitude);

                updateStatistics();
                updateEarthquakeList();
                createEarthquakeMarkers();

                console.log(`✅ Loaded ${earthquakeData.length} earthquakes`);
            } catch (error) {
                console.error('❌ Failed to fetch earthquake data:', error);
            } finally {
                loading.classList.remove('show');
            }
        }

        function createEarthquakeMarkers() {
            // Remove old markers
            earthquakes.forEach(eq => earth.remove(eq));
            earthquakes = [];

            const now = Date.now();

            earthquakeData.forEach(eq => {
                const ageHours = (now - eq.time.getTime()) / (1000 * 60 * 60);

                // Determine color based on age
                let color;
                if (ageHours < 1) {
                    color = new THREE.Color(0xFF0000); // Red - last hour
                } else if (ageHours < 24) {
                    color = new THREE.Color(0xFFA500); // Orange - last day
                } else {
                    color = new THREE.Color(0xFFFF00); // Yellow - last week
                }

                // Size based on magnitude
                const size = Math.pow(2, eq.magnitude - 4) * 0.8;

                // Create marker
                const geometry = new THREE.SphereGeometry(size, 16, 16);
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.8
                });

                const marker = new THREE.Mesh(geometry, material);

                // Position on Earth surface
                const pos = latLonToVector3(eq.lat, eq.lon, 50.5);
                marker.position.copy(pos);

                // Add glow
                const glowGeometry = new THREE.SphereGeometry(size * 1.5, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                marker.add(glow);

                // Store earthquake data
                marker.userData = eq;

                earth.add(marker);
                earthquakes.push(marker);
            });
        }

        function updateStatistics() {
            const now = Date.now();
            const oneDayAgo = now - (24 * 60 * 60 * 1000);

            const todayEarthquakes = earthquakeData.filter(eq => eq.time.getTime() > oneDayAgo);
            const majorEarthquakes = earthquakeData.filter(eq => eq.magnitude >= 6.0);
            const maxMag = earthquakeData.length > 0 ? earthquakeData[0].magnitude : 0;

            document.getElementById('totalCount').textContent = earthquakeData.length;
            document.getElementById('maxMagnitude').textContent = maxMag.toFixed(1);
            document.getElementById('todayCount').textContent = todayEarthquakes.length;
            document.getElementById('majorCount').textContent = majorEarthquakes.length;
        }

        function updateEarthquakeList() {
            const container = document.getElementById('recentEarthquakes');
            container.innerHTML = '';

            const top10 = earthquakeData.slice(0, 10);

            top10.forEach(eq => {
                const item = document.createElement('div');
                const mag = Math.floor(eq.magnitude);
                item.className = `earthquake-item magnitude-${mag}`;

                const timeAgo = getTimeAgo(eq.time);

                item.innerHTML = `
                    <div>
                        <span class="eq-magnitude">${eq.magnitude.toFixed(1)}</span>
                        <span style="font-weight: bold;">${eq.place}</span>
                    </div>
                    <div class="eq-time">${timeAgo} - Depth: ${eq.depth.toFixed(0)}km</div>
                `;

                item.onclick = () => focusOnEarthquake(eq);
                container.appendChild(item);
            });
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

            if (seconds < 60) return `${seconds}초 전`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}분 전`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}시간 전`;
            return `${Math.floor(seconds / 86400)}일 전`;
        }

        function focusOnEarthquake(eq) {
            const pos = latLonToVector3(eq.lat, eq.lon, 120);

            controls.target.copy(latLonToVector3(eq.lat, eq.lon, 50));
            camera.position.copy(pos);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                animationTime += 0.016;

                // Pulse earthquakes
                earthquakes.forEach((marker, idx) => {
                    const pulse = 1.0 + Math.sin(animationTime * 3 + idx * 0.5) * 0.2;
                    marker.children[0].scale.set(pulse, pulse, pulse);
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(earthquakes);

            const tooltip = document.getElementById('tooltip');

            if (intersects.length > 0) {
                const eq = intersects[0].object.userData;

                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 10 + 'px';
                tooltip.style.top = event.clientY + 10 + 'px';

                tooltip.innerHTML = `
                    <div class="tooltip-magnitude">규모 ${eq.magnitude.toFixed(1)}</div>
                    <div>${eq.place}</div>
                    <div style="margin-top: 5px; font-size: 10px; opacity: 0.7;">
                        깊이: ${eq.depth.toFixed(0)}km<br>
                        ${getTimeAgo(eq.time)}
                    </div>
                `;

                renderer.domElement.style.cursor = 'pointer';
            } else {
                tooltip.style.display = 'none';
                renderer.domElement.style.cursor = 'default';
            }
        }

        function onClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(earthquakes);

            if (intersects.length > 0) {
                const eq = intersects[0].object.userData;
                focusOnEarthquake(eq);
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function setupUI() {
            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', fetchEarthquakeData);

            // Pause button
            document.getElementById('pauseBtn').addEventListener('click', function() {
                isPaused = !isPaused;
                controls.autoRotate = !isPaused;
                this.textContent = isPaused ? '▶️ 회전 재개' : '⏸ 회전 일시정지';
            });

            // Reset button
            document.getElementById('resetBtn').addEventListener('click', function() {
                camera.position.set(0, 0, 150);
                controls.target.set(0, 0, 0);
                controls.reset();
            });
        }

        // Initialize
        init();
    </script>
</body>
</html>
