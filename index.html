<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Seismic Monitor - Professional Disaster Monitoring Dashboard</title>

    <!-- SEO -->
    <meta name="description" content="Professional real-time earthquake monitoring dashboard with 3D visualization and advanced interaction.">
    <meta name="theme-color" content="#0b0f19">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ========== MODERN DARK DASHBOARD THEME ========== */
        :root {
            /* Color Palette */
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-sidebar: rgba(17, 24, 39, 0.95);
            --bg-glass: rgba(30, 41, 59, 0.6);

            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-teal: #14b8a6;

            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --border-color: rgba(148, 163, 184, 0.1);

            /* Typography */
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== LAYOUT ========== */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ========== TOP HEADER ========== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: linear-gradient(180deg, rgba(11, 15, 25, 0.95) 0%, rgba(11, 15, 25, 0.8) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent-red);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse-live 2s ease-in-out infinite;
        }

        @keyframes pulse-live {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .header-stats {
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent-cyan);
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            position: fixed;
            top: 70px;
            right: 0;
            width: 380px;
            height: calc(100vh - 70px);
            background: var(--bg-sidebar);
            backdrop-filter: blur(30px);
            border-left: 1px solid var(--border-color);
            z-index: 50;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.collapsed {
            transform: translateX(100%);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-box:focus {
            background: rgba(30, 41, 59, 0.8);
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .earthquake-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .earthquake-list::-webkit-scrollbar {
            width: 6px;
        }

        .earthquake-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .earthquake-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }

        .earthquake-list::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        .earthquake-item {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .earthquake-item:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: var(--accent-blue);
            transform: translateX(-4px);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
        }

        .earthquake-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .magnitude-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            font-family: var(--font-mono);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .magnitude-badge.minor {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            color: white;
        }

        .magnitude-badge.moderate {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .magnitude-badge.major {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .earthquake-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .earthquake-location {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            line-height: 1.4;
        }

        .earthquake-depth {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* ========== SIDEBAR TOGGLE BUTTON ========== */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            width: 40px;
            height: 80px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-right: none;
            border-radius: 8px 0 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 60;
            transition: all 0.3s;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        .sidebar-toggle:hover {
            background: rgba(59, 130, 246, 0.1);
            width: 45px;
        }

        .sidebar.collapsed ~ .sidebar-toggle {
            right: 0;
        }

        .sidebar:not(.collapsed) ~ .sidebar-toggle {
            right: 380px;
        }

        /* ========== TOOLTIP ========== */
        #tooltip {
            position: fixed;
            padding: 0.75rem 1rem;
            background: rgba(17, 24, 39, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.875rem;
            pointer-events: none;
            opacity: 0;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: opacity 0.2s;
        }

        #tooltip.visible {
            opacity: 1;
        }

        .tooltip-mag {
            font-size: 1rem;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-bottom: 0.25rem;
        }

        .tooltip-location {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .header {
                height: 60px;
                padding: 0 1rem;
            }

            .header-title {
                font-size: 1.1rem;
            }

            .header-stats {
                display: none;
            }

            .sidebar {
                top: auto;
                bottom: 0;
                right: 0;
                left: 0;
                width: 100%;
                height: 60vh;
                border-left: none;
                border-top: 1px solid var(--border-color);
                border-radius: 20px 20px 0 0;
            }

            .sidebar.collapsed {
                transform: translateY(100%);
            }

            .sidebar-toggle {
                top: auto;
                bottom: 60vh;
                right: 50%;
                transform: translateX(50%);
                width: 80px;
                height: 40px;
                border-radius: 8px 8px 0 0;
                border-right: 1px solid var(--border-color);
                border-bottom: none;
            }

            .sidebar.collapsed ~ .sidebar-toggle {
                bottom: 0;
            }

            .sidebar:not(.collapsed) ~ .sidebar-toggle {
                bottom: 60vh;
            }
        }

        /* ========== LOADING INDICATOR ========== */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Indicator -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div style="color: var(--text-secondary);">Initializing Seismic Monitor...</div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <h1 class="header-title">Global Seismic Monitor</h1>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>LIVE</span>
            </div>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <div class="stat-label">Total Quakes</div>
                <div class="stat-value" id="totalQuakes">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Last 24h</div>
                <div class="stat-value" id="quakes24h">0</div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <input
                type="text"
                class="search-box"
                id="searchBox"
                placeholder="Search by location (e.g., Japan, Chile)..."
            >
        </div>
        <div class="earthquake-list" id="earthquakeList">
            <div class="empty-state">
                <div class="empty-state-icon">🌍</div>
                <div>Loading earthquake data...</div>
            </div>
        </div>
    </aside>

    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle">◀</button>

    <!-- Tooltip -->
    <div id="tooltip">
        <div class="tooltip-mag"></div>
        <div class="tooltip-location"></div>
    </div>

    <!-- Three.js from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        /* ========== CONFIGURATION ========== */
        const CONFIG = {
            API_URL: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson',
            REFRESH_INTERVAL: 5 * 60 * 1000, // 5 minutes
            EARTH_RADIUS: 50,
            CAMERA_DISTANCE: 150,

            // High-quality Earth textures
            TEXTURES: {
                EARTH_MAP: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg',
                NORMAL_MAP: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg',
                SPECULAR_MAP: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg'
            },

            // Marker colors
            COLORS: {
                ATMOSPHERE: 0x3b82f6, // Neon Blue
                MINOR: 0x14b8a6,      // Teal
                MODERATE: 0xf97316,   // Orange
                MAJOR: 0xef4444       // Red
            }
        };

        /* ========== GLOBAL STATE ========== */
        let scene, camera, renderer, controls;
        let earth, atmosphere;
        let earthquakeMarkers = [];
        let earthquakeData = [];
        let filteredData = [];
        let isAnimating = false;
        let hoveredMarker = null;

        /* ========== INITIALIZATION ========== */
        async function init() {
            console.log('🌍 Initializing Global Seismic Monitor...');

            setupScene();
            setupCamera();
            setupRenderer();
            setupLights();
            setupControls();

            await createEarth();
            createAtmosphere();

            await fetchEarthquakeData();

            setupEventListeners();
            animate();

            document.getElementById('loading').style.display = 'none';
            console.log('✅ System ready');
        }

        function setupScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19); // Deep navy background
        }

        function setupCamera() {
            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(
                45,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.z = CONFIG.CAMERA_DISTANCE;
        }

        function setupRenderer() {
            const container = document.getElementById('canvas-container');
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);
        }

        function setupLights() {
            // Ambient light for overall illumination
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            // Main directional light (Sun) - creates realistic day/night effect
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(100, 50, 50);
            scene.add(sunLight);

            // Rim light for depth and definition
            const rimLight = new THREE.DirectionalLight(0x4488ff, 0.3);
            rimLight.position.set(-100, 0, -50);
            scene.add(rimLight);

            // Fill light to reduce harsh shadows
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.2);
            fillLight.position.set(0, -50, 0);
            scene.add(fillLight);
        }

        function setupControls() {
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;
            controls.minDistance = 80;
            controls.maxDistance = 300;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.3;
            controls.enablePan = false;
        }

        /* ========== REALISTIC EARTH WITH CONTINENTS ========== */
        async function createEarth() {
            const geometry = new THREE.SphereGeometry(CONFIG.EARTH_RADIUS, 128, 128);
            const textureLoader = new THREE.TextureLoader();

            return new Promise((resolve) => {
                let loadedTextures = {
                    map: null,
                    normalMap: null,
                    specularMap: null
                };
                let loadCount = 0;
                const totalTextures = 3;

                function checkComplete() {
                    loadCount++;
                    if (loadCount === totalTextures) {
                        createEarthMesh();
                        resolve();
                    }
                }

                function createEarthMesh() {
                    const material = new THREE.MeshPhongMaterial({
                        // Main texture - shows continents and oceans
                        map: loadedTextures.map,

                        // Normal map - adds terrain depth (mountains, valleys)
                        normalMap: loadedTextures.normalMap,
                        normalScale: new THREE.Vector2(2.0, 2.0),

                        // Specular map - makes oceans shiny, land matte
                        specularMap: loadedTextures.specularMap,
                        specular: new THREE.Color(0x444444),
                        shininess: 20,

                        // Subtle ambient glow
                        emissive: new THREE.Color(0x0a0a0a),
                        emissiveIntensity: 0.05
                    });

                    earth = new THREE.Mesh(geometry, material);
                    scene.add(earth);

                    console.log('✅ High-quality Earth with continents loaded');
                }

                // Load Earth texture
                textureLoader.load(
                    CONFIG.TEXTURES.EARTH_MAP,
                    (texture) => {
                        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        loadedTextures.map = texture;
                        console.log('✅ Earth texture loaded');
                        checkComplete();
                    },
                    undefined,
                    (err) => {
                        console.warn('⚠️ Earth texture failed');
                        checkComplete();
                    }
                );

                // Load Normal map
                textureLoader.load(
                    CONFIG.TEXTURES.NORMAL_MAP,
                    (texture) => {
                        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        loadedTextures.normalMap = texture;
                        console.log('✅ Normal map loaded');
                        checkComplete();
                    },
                    undefined,
                    (err) => {
                        console.warn('⚠️ Normal map failed');
                        checkComplete();
                    }
                );

                // Load Specular map
                textureLoader.load(
                    CONFIG.TEXTURES.SPECULAR_MAP,
                    (texture) => {
                        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        loadedTextures.specularMap = texture;
                        console.log('✅ Specular map loaded');
                        checkComplete();
                    },
                    undefined,
                    (err) => {
                        console.warn('⚠️ Specular map failed');
                        checkComplete();
                    }
                );
            });
        }

        function createAtmosphere() {
            const geometry = new THREE.SphereGeometry(CONFIG.EARTH_RADIUS * 1.05, 32, 32);
            const material = new THREE.MeshBasicMaterial({
                color: CONFIG.COLORS.ATMOSPHERE,
                transparent: true,
                opacity: 0.1,
                side: THREE.BackSide
            });

            atmosphere = new THREE.Mesh(geometry, material);
            scene.add(atmosphere);
        }

        /* ========== EARTHQUAKE DATA ========== */
        async function fetchEarthquakeData() {
            try {
                const response = await fetch(CONFIG.API_URL);
                const data = await response.json();

                earthquakeData = data.features.map(feature => ({
                    magnitude: feature.properties.mag,
                    location: feature.properties.place,
                    time: feature.properties.time,
                    lat: feature.geometry.coordinates[1],
                    lon: feature.geometry.coordinates[0],
                    depth: feature.geometry.coordinates[2],
                    title: feature.properties.title
                }));

                earthquakeData.sort((a, b) => b.time - a.time);
                filteredData = [...earthquakeData];

                createEarthquakeMarkers();
                updateUI();
                updateStats();

                console.log(`✅ Loaded ${earthquakeData.length} earthquakes`);
            } catch (error) {
                console.error('❌ Failed to fetch earthquake data:', error);
            }
        }

        /* ========== RIPPLE/PULSE MARKERS ========== */
        function createEarthquakeMarkers() {
            // Remove old markers
            earthquakeMarkers.forEach(marker => {
                earth.remove(marker);
            });
            earthquakeMarkers = [];

            filteredData.forEach((eq, index) => {
                const { lat, lon, magnitude } = eq;

                // Determine color and size based on magnitude
                let color, size;
                if (magnitude < 4) {
                    color = CONFIG.COLORS.MINOR;
                    size = 0.8;
                } else if (magnitude < 6) {
                    color = CONFIG.COLORS.MODERATE;
                    size = 1.2;
                } else {
                    color = CONFIG.COLORS.MAJOR;
                    size = 1.8;
                }

                // Create pulsing ring marker
                const ringGeometry = new THREE.RingGeometry(size * 0.7, size * 1.2, 32);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide
                });

                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                const pos = latLonToVector3(lat, lon, CONFIG.EARTH_RADIUS + 0.5);
                ring.position.copy(pos);
                ring.lookAt(new THREE.Vector3(0, 0, 0));

                ring.userData = {
                    ...eq,
                    index,
                    pulseOffset: Math.random() * Math.PI * 2,
                    baseSize: size
                };

                earth.add(ring);
                earthquakeMarkers.push(ring);
            });
        }

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            return new THREE.Vector3(x, y, z);
        }

        /* ========== UI UPDATES ========== */
        function updateUI() {
            const listContainer = document.getElementById('earthquakeList');

            if (filteredData.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div>No earthquakes found</div>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filteredData.map((eq, index) => {
                const magnitude = eq.magnitude.toFixed(1);
                const location = eq.location;
                const time = formatTime(eq.time);
                const depth = eq.depth ? `${eq.depth.toFixed(1)} km depth` : 'Unknown depth';

                let badgeClass = 'minor';
                if (eq.magnitude >= 6) badgeClass = 'major';
                else if (eq.magnitude >= 4) badgeClass = 'moderate';

                return `
                    <div class="earthquake-item" onclick="flyToEarthquake(${index})">
                        <div class="earthquake-item-header">
                            <div class="magnitude-badge ${badgeClass}">
                                ${magnitude}
                            </div>
                            <div class="earthquake-time">${time}</div>
                        </div>
                        <div class="earthquake-location">${location}</div>
                        <div class="earthquake-depth">${depth}</div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const total = earthquakeData.length;
            const last24h = earthquakeData.filter(eq =>
                Date.now() - eq.time < 24 * 60 * 60 * 1000
            ).length;

            document.getElementById('totalQuakes').textContent = total;
            document.getElementById('quakes24h').textContent = last24h;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = Date.now();
            const diff = now - timestamp;

            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            return `${days}d ago`;
        }

        /* ========== CLICK-TO-FLY INTERACTION ========== */
        window.flyToEarthquake = function(index) {
            const eq = filteredData[index];
            if (!eq || isAnimating) return;

            isAnimating = true;
            controls.autoRotate = false;

            const targetPos = latLonToVector3(eq.lat, eq.lon, CONFIG.EARTH_RADIUS);
            const distance = 100;
            const direction = targetPos.clone().normalize();
            const cameraTarget = direction.multiplyScalar(distance);

            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = Date.now();
            const duration = 2000;

            function animateCamera() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Smooth easing
                const eased = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                camera.position.lerpVectors(startPos, cameraTarget, eased);
                controls.target.lerpVectors(startTarget, targetPos, eased);
                controls.update();

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                } else {
                    isAnimating = false;
                    setTimeout(() => {
                        controls.autoRotate = true;
                    }, 3000);
                }
            }

            animateCamera();
        };

        /* ========== HOVER TOOLTIP ========== */
        function setupEventListeners() {
            const tooltip = document.getElementById('tooltip');
            const canvas = renderer.domElement;
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            canvas.addEventListener('mousemove', (event) => {
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(earthquakeMarkers);

                if (intersects.length > 0) {
                    const marker = intersects[0].object;
                    const eq = marker.userData;

                    tooltip.querySelector('.tooltip-mag').textContent = `M ${eq.magnitude.toFixed(1)}`;
                    tooltip.querySelector('.tooltip-location').textContent = eq.location;
                    tooltip.style.left = event.clientX + 15 + 'px';
                    tooltip.style.top = event.clientY + 15 + 'px';
                    tooltip.classList.add('visible');

                    hoveredMarker = marker;
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.classList.remove('visible');
                    hoveredMarker = null;
                    canvas.style.cursor = 'default';
                }
            });

            canvas.addEventListener('mouseleave', () => {
                tooltip.classList.remove('visible');
                hoveredMarker = null;
            });

            // Sidebar toggle
            document.getElementById('sidebarToggle').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                const toggle = document.getElementById('sidebarToggle');
                sidebar.classList.toggle('collapsed');
                toggle.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
            });

            // Search filter
            document.getElementById('searchBox').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();

                if (query === '') {
                    filteredData = [...earthquakeData];
                } else {
                    filteredData = earthquakeData.filter(eq =>
                        eq.location.toLowerCase().includes(query)
                    );
                }

                createEarthquakeMarkers();
                updateUI();
            });

            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        /* ========== ANIMATION LOOP ========== */
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Pulse earthquake markers
            earthquakeMarkers.forEach(marker => {
                const pulse = 1.0 + Math.sin(time * 2 + marker.userData.pulseOffset) * 0.3;
                marker.scale.set(pulse, pulse, 1);
                marker.material.opacity = 0.5 + Math.sin(time * 2 + marker.userData.pulseOffset) * 0.3;
            });

            // Highlight hovered marker
            if (hoveredMarker) {
                hoveredMarker.scale.set(1.5, 1.5, 1);
                hoveredMarker.material.opacity = 1;
            }

            // Rotate earth
            if (earth) {
                earth.rotation.y += 0.0002;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        /* ========== AUTO REFRESH ========== */
        setInterval(() => {
            console.log('🔄 Refreshing earthquake data...');
            fetchEarthquakeData();
        }, CONFIG.REFRESH_INTERVAL);

        // Start application
        init();
    </script>
</body>
</html>
