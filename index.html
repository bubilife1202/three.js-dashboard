    <style>
        /* ========== CSS VARIABLES - Easy Theme Customization ========== */
        :root {
            /* Sci-Fi Color Palette */
            --color-bg-primary: #0a0e27;
            --color-bg-secondary: #0f1429;
            --color-accent-cyan: #00f0ff;
            --color-accent-magenta: #ff00ea;
            --color-accent-yellow: #ffea00;
            --color-text-primary: #ffffff;
            --color-text-secondary: #a0aec0;
            --color-glass-bg: rgba(15, 20, 41, 0.7);
            --color-glass-border: rgba(0, 240, 255, 0.2);

            /* Earthquake Colors */
            --color-quake-minor: #00ff88;     /* < 4.0 */
            --color-quake-moderate: #ffea00;   /* 4.0-5.9 */
            --color-quake-major: #ff4444;      /* >= 6.0 */

            /* Spacing */
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;

            /* Typography */
            --font-primary: 'Orbitron', monospace;
            --font-secondary: 'Rajdhani', sans-serif;
        }

        /* ========== GLOBAL RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* No scrollbars */
            font-family: var(--font-secondary);
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========== CANVAS CONTAINER ========== */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ========== HUD OVERLAY SYSTEM ========== */
        .hud-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud-overlay * {
            pointer-events: auto;
        }

        /* ========== TOP LEFT LOGO ========== */
        .hud-logo {
            position: absolute;
            top: var(--spacing-md);
            left: var(--spacing-md);
            font-family: var(--font-primary);
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--color-accent-cyan), var(--color-accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .hud-logo-subtitle {
            font-family: var(--font-secondary);
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            font-weight: 300;
            color: var(--color-accent-cyan);
            letter-spacing: 0.3em;
            margin-top: 0.25rem;
            opacity: 0.8;
        }

        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }
            50% { text-shadow: 0 0 40px rgba(0, 240, 255, 0.8); }
        }

        /* ========== NEWS TICKER (BOTTOM) ========== */
        .news-ticker {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(90deg,
                rgba(10, 14, 39, 0.9) 0%,
                rgba(15, 20, 41, 0.95) 50%,
                rgba(10, 14, 39, 0.9) 100%
            );
            border-top: 2px solid var(--color-accent-cyan);
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: 0 -5px 30px rgba(0, 240, 255, 0.2);
        }

        .ticker-label {
            flex-shrink: 0;
            padding: 0 var(--spacing-md);
            font-family: var(--font-primary);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--color-accent-cyan);
            border-right: 2px solid var(--color-accent-cyan);
            background: rgba(0, 240, 255, 0.1);
        }

        .ticker-content {
            flex: 1;
            display: flex;
            white-space: nowrap;
            animation: scroll-ticker 30s linear infinite;
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            padding: 0 var(--spacing-xl);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .ticker-magnitude {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            margin-right: 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            font-family: var(--font-primary);
        }

        .ticker-magnitude.minor { background: var(--color-quake-minor); color: #000; }
        .ticker-magnitude.moderate { background: var(--color-quake-moderate); color: #000; }
        .ticker-magnitude.major { background: var(--color-quake-major); color: #fff; }

        @keyframes scroll-ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ========== GLASS-MORPHISM RIGHT PANEL ========== */
        .side-panel {
            position: absolute;
            top: 50%;
            right: var(--spacing-md);
            transform: translateY(-50%);
            width: clamp(300px, 25vw, 400px);
            max-height: 80vh;
            background: var(--color-glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--color-glass-border);
            border-radius: 12px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .side-panel.collapsed {
            transform: translateY(-50%) translateX(calc(100% - 48px));
        }

        .side-panel.collapsed .panel-content {
            display: none;
        }

        .side-panel.collapsed .panel-title {
            display: none;
        }

        .side-panel.collapsed .panel-toggle {
            background: rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            animation: pulse-button 2s ease-in-out infinite;
        }

        @keyframes pulse-button {
            0%, 100% {
                box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px rgba(0, 240, 255, 0.9);
                transform: scale(1.1);
            }
        }

        .panel-header {
            padding: var(--spacing-md);
            background: linear-gradient(135deg,
                rgba(0, 240, 255, 0.1),
                rgba(255, 0, 234, 0.1)
            );
            border-bottom: 1px solid var(--color-glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-family: var(--font-primary);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .panel-toggle {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(0, 240, 255, 0.2);
            color: var(--color-accent-cyan);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-toggle:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .panel-content {
            max-height: calc(80vh - 70px);
            overflow-y: auto;
            padding: var(--spacing-sm);
        }

        .panel-content::-webkit-scrollbar {
            width: 6px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .panel-content::-webkit-scrollbar-thumb {
            background: var(--color-accent-cyan);
            border-radius: 3px;
        }

        .quake-list-item {
            padding: var(--spacing-sm);
            margin-bottom: var(--spacing-xs);
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quake-list-item:hover {
            background: rgba(0, 240, 255, 0.1);
            transform: translateX(-5px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .quake-list-item.minor { border-left-color: var(--color-quake-minor); }
        .quake-list-item.moderate { border-left-color: var(--color-quake-moderate); }
        .quake-list-item.major { border-left-color: var(--color-quake-major); }

        .quake-mag {
            font-family: var(--font-primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .quake-location {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.25rem;
        }

        .quake-time {
            font-size: 0.75rem;
            color: var(--color-accent-cyan);
            opacity: 0.7;
        }

        /* ========== DETAIL CARD (SHOWN ON CLICK) ========== */
        .detail-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: clamp(300px, 90vw, 500px);
            background: linear-gradient(135deg,
                rgba(10, 14, 39, 0.98),
                rgba(15, 20, 41, 0.98)
            );
            backdrop-filter: blur(30px);
            border: 2px solid var(--color-accent-cyan);
            border-radius: 16px;
            padding: var(--spacing-lg);
            z-index: 100;
            box-shadow:
                0 0 60px rgba(0, 240, 255, 0.6),
                0 20px 60px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .detail-card.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .card-close {
            position: absolute;
            top: var(--spacing-sm);
            right: var(--spacing-sm);
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .card-close:hover {
            background: rgba(255, 68, 68, 0.4);
            transform: rotate(90deg);
        }

        .card-header {
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 2px solid var(--color-accent-cyan);
        }

        .card-magnitude {
            font-family: var(--font-primary);
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--color-accent-cyan), var(--color-accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .card-location {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        .card-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .detail-item {
            padding: var(--spacing-sm);
            background: rgba(0, 240, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--color-accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .card-btn {
            flex: 1;
            padding: var(--spacing-sm);
            border: none;
            background: linear-gradient(135deg, var(--color-accent-cyan), var(--color-accent-magenta));
            color: #fff;
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .card-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.5);
        }

        /* ========== LOADING SCREEN ========== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-bg-primary);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.5s;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(0, 240, 255, 0.1);
            border-top-color: var(--color-accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: var(--spacing-md);
            font-family: var(--font-primary);
            font-size: 1.2rem;
            color: var(--color-accent-cyan);
            letter-spacing: 0.2em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== MOBILE RESPONSIVENESS ========== */
        @media (max-width: 768px) {
            .hud-logo {
                font-size: 1rem;
            }

            .hud-logo-subtitle {
                font-size: 0.6rem;
            }

            .side-panel {
                width: 90vw;
                max-width: none;
                right: 5vw;
            }

            .news-ticker {
                height: 40px;
            }

            .ticker-label {
                font-size: 0.7rem;
                padding: 0 var(--spacing-sm);
            }

            .ticker-item {
                font-size: 0.8rem;
            }

            .detail-card {
                width: 90vw;
                padding: var(--spacing-md);
            }

            .card-magnitude {
                font-size: 2.5rem;
            }

            .card-details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .hud-logo {
                top: var(--spacing-sm);
                left: var(--spacing-sm);
            }

            .side-panel {
                right: var(--spacing-sm);
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>

    <div id="canvas-container"></div>

    <div class="hud-overlay">

        <div class="hud-logo">

        <!-- Bottom News Ticker -->
        <div class="news-ticker">

    <!-- Three.js Library -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- Main Application Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        /* ========== CONFIGURATION ========== */
        const CONFIG = {
            // USGS API Endpoint - Change period here (all_hour, all_day, all_week, all_month)
            API_URL: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson',
            REFRESH_INTERVAL: 5 * 60 * 1000, // 5 minutes

            // Earth Textures - High-Quality 8K Night Earth with PBR Maps
            TEXTURES: {
                // Base Night Map - City lights on dark earth
                EARTH_NIGHT: 'https://raw.githubusercontent.com/turban/webgl-earth/master/images/earth_lights_lrg.jpg',

                // Normal Map - 3D terrain depth (mountains, valleys)
                EARTH_NORMAL: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg',

                // Specular Map - Ocean reflections (white = shiny oceans, black = matte land)
                EARTH_SPECULAR: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg',

                // Fallback textures
                EARTH_DAY: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/textures/planets/earth_atmos_2048.jpg'
            },

            // Visual Settings
            EARTH_RADIUS: 50,
            CAMERA_DISTANCE: 150,
            AUTO_ROTATE_SPEED: 0.3,
            BLOOM_STRENGTH: 1.5,
            BLOOM_RADIUS: 0.4,
            BLOOM_THRESHOLD: 0.1
        };

        /* ========== GLOBAL STATE ========== */
        let scene, camera, renderer, composer, controls;
        let earth, earthGlow, earthquakeMarkers = [];
        let earthquakeData = [];
        let isAnimating = false;

        /* ========== INITIALIZATION ========== */
        async function init() {
            console.log('🚀 Initializing Earthquake 3D System...');

            // Setup Scene
            setupScene();
            setupCamera();
            setupRenderer();
            setupLights();
            setupControls();

            // Create Earth
            await createEarth();
            createAtmosphere();
            createStarfield();

            // Setup Post-Processing (Bloom Effect)
            setupPostProcessing();

            // Load Earthquake Data
            await loadEarthquakeData();

            // Setup UI
            setupUI();

            // Start Animation Loop
            animate();

            // Hide Loading Screen
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');

                // Intro Animation - Zoom to latest major quake
                performIntroAnimation();
            }, 1000);

            // Auto-refresh data
            setInterval(loadEarthquakeData, CONFIG.REFRESH_INTERVAL);

            console.log('✅ System initialized successfully');
        }

        function setupScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.00025);
        }

        function setupCamera() {
            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(
                60,
                container.clientWidth / container.clientHeight,
                0.1,
                10000
            );
            camera.position.set(0, 0, CONFIG.CAMERA_DISTANCE);
        }

        function setupRenderer() {
            const container = document.getElementById('canvas-container');
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);
        }

        function setupLights() {
            // Ambient Light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            // Directional Light (Sun)
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
            sunLight.position.set(5, 3, 5);
            scene.add(sunLight);
        }

        function setupControls() {
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 70;
            controls.maxDistance = 300;
            controls.autoRotate = true;
            controls.autoRotateSpeed = CONFIG.AUTO_ROTATE_SPEED;
            controls.enablePan = false;
        }

        async function createEarth() {
            const geometry = new THREE.SphereGeometry(CONFIG.EARTH_RADIUS, 256, 256);
            const textureLoader = new THREE.TextureLoader();

            // Load all PBR textures for high-end holographic look
            return new Promise((resolve) => {
                let loadedTextures = {
                    base: null,
                    normal: null,
                    specular: null
                };
                let loadCount = 0;
                const totalTextures = 3;

                function checkComplete() {
                    loadCount++;
                    if (loadCount === totalTextures) {
                        createEarthMesh();
                        resolve();
                    }
                }

                function createEarthMesh() {
                    const material = new THREE.MeshPhongMaterial({
                        // Base night texture with city lights
                        map: loadedTextures.base,

                        // Normal map for 3D terrain depth
                        normalMap: loadedTextures.normal,
                        normalScale: new THREE.Vector2(1.5, 1.5),

                        // Specular map - makes oceans shiny, land matte
                        specularMap: loadedTextures.specular,
                        specular: new THREE.Color(0x333333),
                        shininess: 25,

                        // Emissive glow for holographic effect
                        emissive: new THREE.Color(0x0a1a2a),
                        emissiveIntensity: 0.15,
                        emissiveMap: loadedTextures.base, // City lights emit light

                        // Anti-aliasing
                        side: THREE.FrontSide
                    });

                    earth = new THREE.Mesh(geometry, material);
                    scene.add(earth);

                    console.log('✅ High-Quality Earth with PBR textures loaded');
                }

                // Load Base Night Texture
                textureLoader.load(
                    CONFIG.TEXTURES.EARTH_NIGHT,
                    (texture) => {
                        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        loadedTextures.base = texture;
                        console.log('✅ Night texture loaded');
                        checkComplete();
                    },
                    undefined,
                    (err) => {
                        console.warn('⚠️ Night texture failed, using fallback');
                        loadedTextures.base = null;
                        checkComplete();
                    }
                );

                // Load Normal Map
                textureLoader.load(
                    CONFIG.TEXTURES.EARTH_NORMAL,
                    (texture) => {
                        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        loadedTextures.normal = texture;
                        console.log('✅ Normal map loaded');
                        checkComplete();
                    },
                    undefined,
                    (err) => {
                        console.warn('⚠️ Normal map failed, skipping');
                        loadedTextures.normal = null;
                        checkComplete();
                    }
                );

                // Load Specular Map
                textureLoader.load(
                    CONFIG.TEXTURES.EARTH_SPECULAR,
                    (texture) => {
                        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                        loadedTextures.specular = texture;
                        console.log('✅ Specular map loaded');
                        checkComplete();
                    },
                    undefined,
                    (err) => {
                        console.warn('⚠️ Specular map failed, skipping');
                        loadedTextures.specular = null;
                        checkComplete();
                    }
                );
            });
        }

        function createAtmosphere() {
            // Inner atmosphere glow - Cyan holographic effect
            const innerGeometry = new THREE.SphereGeometry(CONFIG.EARTH_RADIUS * 1.04, 128, 128);
            const innerMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec3 vNormal;
                    varying vec3 vPosition;

                    void main() {
                        // Fresnel effect for rim glow
                        vec3 viewDirection = normalize(cameraPosition - vPosition);
                        float fresnel = pow(1.0 - abs(dot(viewDirection, vNormal)), 3.0);

                        // Holographic color gradient (cyan to magenta)
                        vec3 cyan = vec3(0.0, 0.94, 1.0);
                        vec3 magenta = vec3(1.0, 0.0, 0.92);
                        vec3 color = mix(cyan, magenta, fresnel * 0.5);

                        // Pulsing intensity
                        float pulse = 0.7 + 0.3 * sin(time * 1.5);
                        float intensity = fresnel * pulse;

                        gl_FragColor = vec4(color, intensity * 0.6);
                    }
                `,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                transparent: true
            });

            const innerGlow = new THREE.Mesh(innerGeometry, innerMaterial);
            scene.add(innerGlow);

            // Outer atmosphere glow - Extended cyan aura
            const outerGeometry = new THREE.SphereGeometry(CONFIG.EARTH_RADIUS * 1.08, 64, 64);
            const outerMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    varying vec3 vNormal;
                    varying vec3 vPosition;

                    void main() {
                        vec3 viewDirection = normalize(cameraPosition - vPosition);
                        float fresnel = pow(1.0 - abs(dot(viewDirection, vNormal)), 2.0);

                        // Cyan glow
                        vec3 color = vec3(0.0, 0.94, 1.0);

                        // Slow pulse
                        float pulse = 0.5 + 0.5 * sin(time);
                        float intensity = fresnel * pulse;

                        gl_FragColor = vec4(color, intensity * 0.3);
                    }
                `,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                transparent: true
            });

            earthGlow = new THREE.Mesh(outerGeometry, outerMaterial);
            scene.add(earthGlow);

            // Store both for animation
            earthGlow.userData.innerMaterial = innerMaterial;
            earthGlow.userData.outerMaterial = outerMaterial;
        }

        function createStarfield() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsVertices = [];

            for (let i = 0; i < 10000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                starsVertices.push(x, y, z);
            }

            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));

            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.7,
                transparent: true,
                opacity: 0.8
            });

            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        function setupPostProcessing() {
            composer = new EffectComposer(renderer);

            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                CONFIG.BLOOM_STRENGTH,
                CONFIG.BLOOM_RADIUS,
                CONFIG.BLOOM_THRESHOLD
            );
            composer.addPass(bloomPass);
        }

        async function loadEarthquakeData() {
            try {
                console.log('📡 Fetching earthquake data...');
                const response = await fetch(CONFIG.API_URL);
                const data = await response.json();

                earthquakeData = data.features.map(feature => ({
                    magnitude: feature.properties.mag,
                    place: feature.properties.place,
                    time: new Date(feature.properties.time),
                    lat: feature.geometry.coordinates[1],
                    lon: feature.geometry.coordinates[0],
                    depth: feature.geometry.coordinates[2],
                    url: feature.properties.url,
                    title: feature.properties.title
                }));

                earthquakeData.sort((a, b) => b.magnitude - a.magnitude);

                createEarthquakeMarkers();
                updateUI();

                console.log(`✅ Loaded ${earthquakeData.length} earthquakes`);
            } catch (error) {
                console.error('❌ Failed to fetch earthquake data:', error);
            }
        }

        function createEarthquakeMarkers() {
            // Remove old markers
            earthquakeMarkers.forEach(marker => {
                earth.remove(marker);
            });
            earthquakeMarkers = [];

            const now = Date.now();

            earthquakeData.forEach((eq, index) => {
                // Create pulsing ring marker
                const size = Math.pow(2, eq.magnitude - 3) * 0.5;

                // Color based on magnitude
                let color;
                if (eq.magnitude < 4.0) {
                    color = 0x00ff88; // Green
                } else if (eq.magnitude < 6.0) {
                    color = 0xffea00; // Yellow
                } else {
                    color = 0xff4444; // Red
                }

                // Create ring geometry
                const ringGeometry = new THREE.RingGeometry(size * 0.8, size, 32);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });

                const ring = new THREE.Mesh(ringGeometry, ringMaterial);

                // Position on globe
                const pos = latLonToVector3(eq.lat, eq.lon, CONFIG.EARTH_RADIUS + 0.5);
                ring.position.copy(pos);
                ring.lookAt(new THREE.Vector3(0, 0, 0));

                // Add glow
                const glowGeometry = new THREE.RingGeometry(size * 1.2, size * 1.4, 32);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                ring.add(glow);

                // Store earthquake data
                ring.userData = {
                    ...eq,
                    index: index,
                    pulseOffset: Math.random() * Math.PI * 2
                };

                earth.add(ring);
                earthquakeMarkers.push(ring);
            });
        }

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = (lon + 180) * Math.PI / 180;

            const x = -radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            return new THREE.Vector3(x, y, z);
        }

        function updateUI() {
            updateNewsTicker();
            updateSidePanel();
        }

        function updateNewsTicker() {
            const tickerContent = document.getElementById('tickerContent');
            const top5 = earthquakeData.slice(0, 5);

            let html = '';
            // Duplicate for seamless loop
            for (let i = 0; i < 2; i++) {
                top5.forEach(eq => {
                    const severity = eq.magnitude < 4 ? 'minor' : eq.magnitude < 6 ? 'moderate' : 'major';
                    html += `
                        <div class="ticker-item">
                            <span class="ticker-magnitude ${severity}">M ${eq.magnitude.toFixed(1)}</span>
                            ${eq.place} • ${formatTimeAgo(eq.time)}
                        </div>
                    `;
                });
            }

            tickerContent.innerHTML = html;
        }

        function updateSidePanel() {
            const panelContent = document.getElementById('panelContent');
            const top10 = earthquakeData.slice(0, 10);

            let html = '';
            top10.forEach((eq, index) => {
                const severity = eq.magnitude < 4 ? 'minor' : eq.magnitude < 6 ? 'moderate' : 'major';
                html += `
                    <div class="quake-list-item ${severity}" onclick="focusOnQuake(${index})">
                        <div class="quake-mag">M ${eq.magnitude.toFixed(1)}</div>
                        <div class="quake-location">${eq.place}</div>
                        <div class="quake-time">${formatTimeAgo(eq.time)} • Depth: ${eq.depth.toFixed(0)}km</div>
                    </div>
                `;
            });

            panelContent.innerHTML = html;
        }

        function formatTimeAgo(date) {
            const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

            if (seconds < 60) return `${seconds}s ago`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

        function performIntroAnimation() {
            const majorQuake = earthquakeData.find(eq => eq.magnitude >= 5.0);
            if (majorQuake) {
                flyToQuake(majorQuake, 2000);
            }
        }

        function flyToQuake(eq, duration = 1500) {
            if (isAnimating) return;
            isAnimating = true;

            const targetPos = latLonToVector3(eq.lat, eq.lon, CONFIG.EARTH_RADIUS);
            const distance = 100;
            const direction = targetPos.clone().normalize();
            const cameraTarget = direction.multiplyScalar(distance);

            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = Date.now();

            function animateCamera() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = progress < 0.5
                    ? 2 * progress * progress
                    : -1 + (4 - 2 * progress) * progress;

                camera.position.lerpVectors(startPos, cameraTarget, eased);
                controls.target.lerpVectors(startTarget, targetPos, eased);

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                } else {
                    isAnimating = false;
                }
            }

            animateCamera();
        }

        function showDetailCard(eq) {
            const card = document.getElementById('detailCard');
            document.getElementById('cardMagnitude').textContent = eq.magnitude.toFixed(1);
            document.getElementById('cardLocation').textContent = eq.place;
            document.getElementById('cardTime').textContent = eq.time.toLocaleString();
            document.getElementById('cardDepth').textContent = `${eq.depth.toFixed(1)} km`;
            document.getElementById('cardLat').textContent = `${eq.lat.toFixed(2)}°`;
            document.getElementById('cardLon').textContent = `${eq.lon.toFixed(2)}°`;

            const newsQuery = encodeURIComponent(`magnitude ${eq.magnitude.toFixed(1)} earthquake ${eq.place}`);
            document.getElementById('cardNewsBtn').href = `https://www.google.com/search?q=${newsQuery}&tbm=nws`;
            document.getElementById('cardUsgsBtn').href = eq.url || 'https://earthquake.usgs.gov/';

            card.classList.add('show');
        }

        function setupUI() {
            // Panel toggle
            const panelToggle = document.getElementById('panelToggle');
            const sidePanel = document.getElementById('sidePanel');

            panelToggle.addEventListener('click', () => {
                sidePanel.classList.toggle('collapsed');
                panelToggle.textContent = sidePanel.classList.contains('collapsed') ? '←' : '→';
            });

            // Card close
            document.getElementById('cardClose').addEventListener('click', () => {
                document.getElementById('detailCard').classList.remove('show');
            });

            // Click on canvas to detect earthquake markers
            renderer.domElement.addEventListener('click', onCanvasClick);

            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function onCanvasClick(event) {
            const mouse = new THREE.Vector2();
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(earthquakeMarkers, true);

            if (intersects.length > 0) {
                const marker = intersects[0].object;
                let eq = marker.userData;

                // If clicked on child (glow), get parent data
                if (!eq.magnitude && marker.parent && marker.parent.userData) {
                    eq = marker.parent.userData;
                }

                if (eq && eq.magnitude) {
                    flyToQuake(eq);
                    showDetailCard(eq);
                }
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            composer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Pulse earthquake markers
            const time = Date.now() * 0.001;
            earthquakeMarkers.forEach(marker => {
                if (marker.userData && marker.userData.pulseOffset !== undefined) {
                    const pulse = 1.0 + Math.sin(time * 2 + marker.userData.pulseOffset) * 0.3;
                    marker.scale.set(pulse, pulse, 1);
                    marker.material.opacity = 0.5 + Math.sin(time * 2 + marker.userData.pulseOffset) * 0.3;
                }
            });

            // Rotate earth slowly
            if (earth) {
                earth.rotation.y += 0.0002;
            }

            // Animate holographic atmosphere
            if (earthGlow && earthGlow.userData) {
                if (earthGlow.userData.innerMaterial) {
                    earthGlow.userData.innerMaterial.uniforms.time.value = time;
                }
                if (earthGlow.userData.outerMaterial) {
                    earthGlow.userData.outerMaterial.uniforms.time.value = time;
                }
            }

            controls.update();
            composer.render();
        }

        // Make functions available globally
        window.focusOnQuake = function(index) {
            const eq = earthquakeData[index];
            if (eq) {
                flyToQuake(eq);
                showDetailCard(eq);
            }
        };

        // Initialize on page load
        init();
    </script>
