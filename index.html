<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Global Stock Market Wave Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0a1a, #000005);
            color: #ffffff;
        }

        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #controlPanel {
            width: 320px;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
            z-index: 100;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #00CED1;
            text-shadow: 0 0 10px rgba(0, 206, 209, 0.5);
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #9370DB;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .market-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .market-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00CED1;
            transform: translateX(5px);
        }

        .market-btn.active {
            background: rgba(0, 206, 209, 0.2);
            border-color: #00CED1;
            box-shadow: 0 0 15px rgba(0, 206, 209, 0.3);
        }

        .index-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
            border-left: 3px solid;
            cursor: pointer;
            transition: all 0.3s;
        }

        .index-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(3px);
        }

        .index-name {
            font-weight: bold;
            font-size: 13px;
        }

        .index-value {
            font-size: 12px;
            opacity: 0.8;
        }

        .index-change {
            font-size: 11px;
            font-weight: bold;
        }

        .positive {
            color: #00FF00;
            border-left-color: #00FF00;
        }

        .negative {
            color: #FF4500;
            border-left-color: #FF4500;
        }

        .stock-item {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stock-name {
            font-weight: bold;
        }

        .stock-change {
            font-weight: bold;
            font-size: 11px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(147, 112, 219, 0.3);
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-size: 12px;
        }

        .control-btn:hover {
            background: rgba(147, 112, 219, 0.5);
            box-shadow: 0 0 10px rgba(147, 112, 219, 0.5);
        }

        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tooltip-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .tooltip-value {
            font-size: 11px;
            opacity: 0.8;
        }

        /* Scrollbar styling */
        #controlPanel::-webkit-scrollbar {
            width: 6px;
        }

        #controlPanel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #controlPanel::-webkit-scrollbar-thumb {
            background: rgba(147, 112, 219, 0.5);
            border-radius: 3px;
        }

        .flag {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controlPanel">
            <h1>🌌 Global Stock Market Wave Dashboard</h1>

            <div class="section">
                <div class="section-title">Markets</div>
                <button class="market-btn active" data-market="us"><span class="flag">🇺🇸</span> US Market</button>
                <button class="market-btn active" data-market="kr"><span class="flag">🇰🇷</span> Korea Market</button>
            </div>

            <div class="section">
                <div class="section-title">Indices</div>
                <div id="indexList"></div>
            </div>

            <div class="section">
                <div class="section-title">Top Movers (Oct 2025)</div>
                <div id="topMovers"></div>
            </div>

            <div class="section">
                <div class="section-title">YTD Top Performers</div>
                <div id="ytdPerformers"></div>
            </div>

            <div class="section">
                <div class="section-title">Controls</div>
                <div class="controls">
                    <button class="control-btn" id="pauseBtn">Pause</button>
                    <button class="control-btn" id="resetBtn">Reset</button>
                </div>
            </div>
        </div>

        <div id="canvas-container">
            <div id="tooltip"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Market Data
        const marketData = {
            us: {
                indices: [
                    { name: 'S&P 500', value: 6746, change: 0.69, color: '#00CED1' },
                    { name: 'NASDAQ', value: 22966, change: 0.99, color: '#1E90FF' },
                    { name: 'DOW JONES', value: 44772, change: 0.70, color: '#4169E1' }
                ],
                topMovers: [
                    { name: 'AMD', change: 43.06 },
                    { name: 'JB Hunt', change: 26.62 },
                    { name: 'Micron', change: 19.92 },
                    { name: 'Intuitive Surgical', change: 17.90 },
                    { name: 'Thermo Fisher', change: 16.47 }
                ],
                ytdTop: [
                    { name: 'Palantir (PLTR)', change: 107.2 },
                    { name: 'Newmont (NEM)', change: 99.9 },
                    { name: 'Seagate (STX)', change: 94.0 },
                    { name: 'GE Vernova (GEV)', change: 86.4 },
                    { name: 'Western Digital (WDC)', change: 78.3 }
                ]
            },
            kr: {
                indices: [
                    { name: 'KOSPI', value: 3823, change: 2.01, color: '#9370DB' },
                    { name: 'KOSDAQ', value: 872.50, change: -0.37, color: '#BA55D3' }
                ],
                topMovers: [
                    { name: '삼성전자', change: -0.61, value: '97,500원' },
                    { name: 'SK하이닉스', change: -1.34, value: '479,000원' },
                    { name: '한국전력', change: 12.5, value: '턴어라운드' },
                    { name: '효성중공업', change: 8.3, value: '전력장비' }
                ],
                ytdTop: [
                    { name: 'HD현대일렉트릭', change: 156.2 },
                    { name: 'LS ELECTRIC', change: 98.7 },
                    { name: 'SK하이닉스', change: 85.4 },
                    { name: '삼성SDI', change: 62.1 }
                ]
            }
        };

        // Scene setup
        let scene, camera, renderer, controls;
        let nebulas = [];
        let stars = [];
        let isPaused = false;
        let animationTime = 0;
        let raycaster, mouse;
        let activeMarkets = new Set(['us', 'kr']);

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000005, 0.001);

            // Camera
            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(
                75,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 50, 100);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 300;
            controls.minDistance = 30;

            // Raycaster for mouse interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Background stars
            createBackgroundStars();

            // Create nebulas and stars
            createNebulas();
            createStars();

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1, 500);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('click', onClick);

            // UI setup
            setupUI();

            // Animation loop
            animate();
        }

        function createBackgroundStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.7,
                transparent: true,
                opacity: 0.8
            });

            const starsVertices = [];
            for (let i = 0; i < 5000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                starsVertices.push(x, y, z);
            }

            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        function createNebulas() {
            let xOffset = -80;

            // US Market Nebulas
            marketData.us.indices.forEach((index, i) => {
                const nebula = createNebula(index, xOffset, 0, i);
                nebula.userData.market = 'us';
                nebulas.push(nebula);
                xOffset += 60;
            });

            xOffset = -50;

            // Korea Market Nebulas
            marketData.kr.indices.forEach((index, i) => {
                const nebula = createNebula(index, xOffset, -60, i + 3);
                nebula.userData.market = 'kr';
                nebulas.push(nebula);
                xOffset += 60;
            });
        }

        function createNebula(indexData, x, z, id) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            group.userData = { ...indexData, id, type: 'nebula' };

            // Nebula cloud (particle system)
            const particleCount = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];

            const color = new THREE.Color(indexData.color);
            const baseSize = 15 * (1 + Math.abs(indexData.change) / 10);

            for (let i = 0; i < particleCount; i++) {
                const radius = Math.random() * baseSize;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                positions.push(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );

                // Color variation
                const colorVariation = color.clone();
                colorVariation.offsetHSL(0, 0, Math.random() * 0.3 - 0.15);
                colors.push(colorVariation.r, colorVariation.g, colorVariation.b);

                sizes.push(Math.random() * 2 + 0.5);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Shader material for glow effect
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    pulseIntensity: { value: Math.abs(indexData.change) / 2 }
                },
                vertexShader: `
                    attribute float size;
                    attribute vec3 color;
                    varying vec3 vColor;
                    uniform float time;
                    uniform float pulseIntensity;

                    void main() {
                        vColor = color;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        float pulse = 1.0 + sin(time * 2.0 + length(position) * 0.1) * pulseIntensity * 0.3;
                        gl_PointSize = size * pulse * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;

                    void main() {
                        float dist = length(gl_PointCoord - vec2(0.5));
                        if (dist > 0.5) discard;

                        float alpha = 1.0 - (dist * 2.0);
                        alpha = pow(alpha, 2.0);

                        gl_FragColor = vec4(vColor, alpha * 0.6);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particles = new THREE.Points(geometry, material);
            group.add(particles);
            group.userData.particles = particles;

            // Core glow
            const coreGeometry = new THREE.SphereGeometry(baseSize * 0.3, 32, 32);
            const coreMaterial = new THREE.MeshBasicMaterial({
                color: indexData.color,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            const core = new THREE.Mesh(coreGeometry, coreMaterial);
            group.add(core);
            group.userData.core = core;

            // Wave rings
            const ringGeometry = new THREE.RingGeometry(baseSize * 0.5, baseSize * 0.52, 64);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: indexData.color,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            group.add(ring);
            group.userData.ring = ring;

            scene.add(group);
            return group;
        }

        function createStars() {
            const allStocks = [
                ...marketData.us.topMovers.map(s => ({ ...s, market: 'us' })),
                ...marketData.us.ytdTop.map(s => ({ ...s, market: 'us', ytd: true })),
                ...marketData.kr.topMovers.map(s => ({ ...s, market: 'kr' })),
                ...marketData.kr.ytdTop.map(s => ({ ...s, market: 'kr', ytd: true }))
            ];

            allStocks.forEach((stock, index) => {
                const star = createStar(stock, index);
                stars.push(star);
            });
        }

        function createStar(stockData, index) {
            // Find parent nebula based on market
            const marketNebulas = nebulas.filter(n => n.userData.market === stockData.market);
            const parentNebula = marketNebulas[Math.floor(Math.random() * marketNebulas.length)];

            const group = new THREE.Group();

            // Star appearance
            const size = 0.3 + Math.abs(stockData.change) / 50;
            const geometry = new THREE.SphereGeometry(size, 16, 16);

            let color;
            if (stockData.change > 0) {
                color = new THREE.Color().setHSL(0.33, 1, 0.5 + stockData.change / 200);
            } else {
                color = new THREE.Color().setHSL(0, 1, 0.5);
            }

            const material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.9
            });

            const sphere = new THREE.Mesh(geometry, material);
            group.add(sphere);

            // Glow effect
            const glowGeometry = new THREE.SphereGeometry(size * 1.5, 16, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            group.add(glow);

            // Orbital parameters
            const orbitRadius = 20 + Math.random() * 15;
            const orbitSpeed = (0.2 + Math.random() * 0.3) * (stockData.change > 0 ? 1 : -1);
            const orbitTilt = Math.random() * Math.PI / 4;
            const orbitPhase = Math.random() * Math.PI * 2;

            group.userData = {
                ...stockData,
                type: 'star',
                parentNebula: parentNebula,
                orbitRadius,
                orbitSpeed,
                orbitTilt,
                orbitPhase,
                baseColor: color
            };

            scene.add(group);
            return group;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                animationTime += 0.016;

                // Animate nebulas
                nebulas.forEach((nebula, i) => {
                    if (!activeMarkets.has(nebula.userData.market)) {
                        nebula.visible = false;
                        return;
                    }
                    nebula.visible = true;

                    // Rotate nebula
                    nebula.rotation.y += 0.001;

                    // Pulse effect
                    const scale = 1 + Math.sin(animationTime * 2 + i) * 0.05;
                    if (nebula.userData.core) {
                        nebula.userData.core.scale.set(scale, scale, scale);
                    }

                    // Update shader time
                    if (nebula.userData.particles) {
                        nebula.userData.particles.material.uniforms.time.value = animationTime;
                    }

                    // Wave rings
                    if (nebula.userData.ring) {
                        const ringScale = 1 + (animationTime * 0.5) % 1;
                        nebula.userData.ring.scale.set(ringScale, ringScale, 1);
                        nebula.userData.ring.material.opacity = 0.5 * (1 - (animationTime * 0.5) % 1);
                    }
                });

                // Animate stars (orbit around nebulas)
                stars.forEach(star => {
                    if (!activeMarkets.has(star.userData.market)) {
                        star.visible = false;
                        return;
                    }
                    star.visible = true;

                    const parent = star.userData.parentNebula;
                    if (!parent) return;

                    const angle = animationTime * star.userData.orbitSpeed + star.userData.orbitPhase;
                    const radius = star.userData.orbitRadius;

                    star.position.x = parent.position.x + Math.cos(angle) * radius;
                    star.position.y = Math.sin(angle) * radius * Math.sin(star.userData.orbitTilt);
                    star.position.z = parent.position.z + Math.sin(angle) * radius * Math.cos(star.userData.orbitTilt);

                    // Twinkle effect
                    star.rotation.y += 0.02;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const allObjects = [...nebulas, ...stars];
            const intersects = raycaster.intersectObjects(allObjects, true);

            const tooltip = document.getElementById('tooltip');

            if (intersects.length > 0) {
                let object = intersects[0].object;
                while (object.parent && !object.userData.type) {
                    object = object.parent;
                }

                if (object.userData && object.userData.type) {
                    const data = object.userData;
                    tooltip.style.display = 'block';
                    tooltip.style.left = event.clientX + 10 + 'px';
                    tooltip.style.top = event.clientY + 10 + 'px';

                    if (data.type === 'nebula') {
                        tooltip.innerHTML = `
                            <div class="tooltip-name">${data.name}</div>
                            <div class="tooltip-value">Value: ${data.value.toLocaleString()}</div>
                            <div class="tooltip-value ${data.change >= 0 ? 'positive' : 'negative'}">
                                Change: ${data.change >= 0 ? '+' : ''}${data.change}%
                            </div>
                        `;
                    } else if (data.type === 'star') {
                        tooltip.innerHTML = `
                            <div class="tooltip-name">${data.name}</div>
                            <div class="tooltip-value ${data.change >= 0 ? 'positive' : 'negative'}">
                                ${data.change >= 0 ? '+' : ''}${data.change.toFixed(2)}%
                            </div>
                            ${data.value ? `<div class="tooltip-value">${data.value}</div>` : ''}
                        `;
                    }

                    renderer.domElement.style.cursor = 'pointer';
                } else {
                    tooltip.style.display = 'none';
                    renderer.domElement.style.cursor = 'default';
                }
            } else {
                tooltip.style.display = 'none';
                renderer.domElement.style.cursor = 'default';
            }
        }

        function onClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const allObjects = [...nebulas, ...stars];
            const intersects = raycaster.intersectObjects(allObjects, true);

            if (intersects.length > 0) {
                let object = intersects[0].object;
                while (object.parent && !object.userData.type) {
                    object = object.parent;
                }

                if (object.userData && object.userData.type === 'nebula') {
                    // Focus camera on nebula
                    const targetPos = object.position.clone();
                    const distance = 40;
                    const newCameraPos = new THREE.Vector3(
                        targetPos.x,
                        targetPos.y + distance * 0.5,
                        targetPos.z + distance
                    );

                    // Smooth camera transition
                    gsap.to(camera.position, {
                        duration: 1.5,
                        x: newCameraPos.x,
                        y: newCameraPos.y,
                        z: newCameraPos.z,
                        onUpdate: () => {
                            camera.lookAt(targetPos);
                        }
                    });
                }
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function setupUI() {
            // Populate index list
            const indexList = document.getElementById('indexList');
            [...marketData.us.indices, ...marketData.kr.indices].forEach(index => {
                const item = document.createElement('div');
                item.className = `index-item ${index.change >= 0 ? 'positive' : 'negative'}`;
                item.innerHTML = `
                    <div class="index-name">${index.name}</div>
                    <div class="index-value">${index.value.toLocaleString()}</div>
                    <div class="index-change">${index.change >= 0 ? '+' : ''}${index.change}%</div>
                `;
                indexList.appendChild(item);
            });

            // Populate top movers
            const topMovers = document.getElementById('topMovers');
            [...marketData.us.topMovers.slice(0, 5), ...marketData.kr.topMovers.slice(0, 3)].forEach(stock => {
                const item = document.createElement('div');
                item.className = 'stock-item';
                item.innerHTML = `
                    <span class="stock-name">${stock.name}</span>
                    <span class="stock-change ${stock.change >= 0 ? 'positive' : 'negative'}">
                        ${stock.change >= 0 ? '+' : ''}${stock.change}%
                    </span>
                `;
                topMovers.appendChild(item);
            });

            // Populate YTD performers
            const ytdPerformers = document.getElementById('ytdPerformers');
            [...marketData.us.ytdTop.slice(0, 3), ...marketData.kr.ytdTop.slice(0, 2)].forEach(stock => {
                const item = document.createElement('div');
                item.className = 'stock-item';
                item.innerHTML = `
                    <span class="stock-name">${stock.name}</span>
                    <span class="stock-change positive">+${stock.change}%</span>
                `;
                ytdPerformers.appendChild(item);
            });

            // Market filter buttons
            document.querySelectorAll('.market-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const market = this.dataset.market;
                    if (activeMarkets.has(market)) {
                        activeMarkets.delete(market);
                        this.classList.remove('active');
                    } else {
                        activeMarkets.add(market);
                        this.classList.add('active');
                    }
                });
            });

            // Pause button
            document.getElementById('pauseBtn').addEventListener('click', function() {
                isPaused = !isPaused;
                this.textContent = isPaused ? 'Resume' : 'Pause';
            });

            // Reset button
            document.getElementById('resetBtn').addEventListener('click', function() {
                camera.position.set(0, 50, 100);
                controls.reset();
            });
        }

        // Add GSAP for smooth camera transitions (using simple fallback)
        const gsap = {
            to: (target, options) => {
                const start = { ...target };
                const duration = options.duration * 1000;
                const startTime = Date.now();

                function update() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = progress < 0.5
                        ? 2 * progress * progress
                        : -1 + (4 - 2 * progress) * progress;

                    Object.keys(options).forEach(key => {
                        if (key !== 'duration' && key !== 'onUpdate' && typeof options[key] === 'number') {
                            target[key] = start[key] + (options[key] - start[key]) * eased;
                        }
                    });

                    if (options.onUpdate) options.onUpdate();

                    if (progress < 1) {
                        requestAnimationFrame(update);
                    }
                }

                update();
            }
        };

        // Initialize
        init();
    </script>
</body>
</html>
