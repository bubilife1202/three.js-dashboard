<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Global Earthquake Monitor - 실시간 지진 3D 지구</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #000000, #0a0a1a);
            color: #ffffff;
            touch-action: none;
        }

        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #controlPanel {
            width: 320px;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 모바일 토글 버튼 */
        #menuToggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: rgba(255, 69, 0, 0.8);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.5);
        }

        h1 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #FF4500;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        .subtitle {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #FF6347;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-box {
            background: rgba(255, 69, 0, 0.1);
            border: 1px solid rgba(255, 69, 0, 0.3);
            border-radius: 5px;
            padding: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: bold;
            color: #FF4500;
        }

        .stat-label {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 3px;
        }

        .earthquake-item {
            padding: 8px;
            margin: 4px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
            border-left: 3px solid;
            font-size: 11px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .earthquake-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(3px);
        }

        .eq-magnitude {
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
            width: 45px;
        }

        .eq-time {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 3px;
        }

        .magnitude-7 { border-left-color: #8B0000; background: rgba(139, 0, 0, 0.2); }
        .magnitude-6 { border-left-color: #FF0000; background: rgba(255, 0, 0, 0.15); }
        .magnitude-5 { border-left-color: #FF4500; background: rgba(255, 69, 0, 0.1); }
        .magnitude-4 { border-left-color: #FFA500; background: rgba(255, 165, 0, 0.08); }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }

        .legend-color {
            width: 25px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .control-btn {
            width: 100%;
            padding: 10px;
            margin: 4px 0;
            border: 1px solid rgba(255, 69, 0, 0.3);
            background: rgba(255, 69, 0, 0.2);
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-size: 12px;
        }

        .control-btn:hover {
            background: rgba(255, 69, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.3);
        }

        .filter-group {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .filter-btn {
            flex: 1;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-size: 10px;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: rgba(255, 69, 0, 0.3);
            border-color: #FF4500;
        }

        #loadingIndicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 69, 0, 0.9);
            border: 1px solid rgba(255, 69, 0, 0.5);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 200;
            display: none;
            color: white;
        }

        #loadingIndicator.show {
            display: block;
        }

        #tooltip {
            position: fixed;
            background: rgba(255, 69, 0, 0.95);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            pointer-events: none;
            display: none;
            z-index: 10000;
            font-size: 13px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            max-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .tooltip-magnitude {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #FFF;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .tooltip-info {
            font-size: 12px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .ring-of-fire {
            color: #FF4500;
            font-weight: bold;
        }

        #controlPanel::-webkit-scrollbar {
            width: 6px;
        }

        #controlPanel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #controlPanel::-webkit-scrollbar-thumb {
            background: rgba(255, 69, 0, 0.5);
            border-radius: 3px;
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            #menuToggle {
                display: block;
            }

            #controlPanel {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                width: 85%;
                max-width: 300px;
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
            }

            #controlPanel.open {
                transform: translateX(0);
            }

            #canvas-container {
                width: 100%;
            }

            h1 {
                font-size: 16px;
            }

            .subtitle {
                font-size: 10px;
            }

            .section {
                margin-bottom: 15px;
            }

            .section-title {
                font-size: 12px;
            }

            .stat-number {
                font-size: 18px;
            }

            #loadingIndicator {
                top: 75px;
                right: 10px;
                font-size: 11px;
                padding: 8px 12px;
            }

            #tooltip {
                font-size: 12px;
                padding: 10px 12px;
                max-width: 240px;
            }

            .tooltip-magnitude {
                font-size: 18px;
            }

            .tooltip-info {
                font-size: 11px;
            }
        }

        /* 태블릿 */
        @media (min-width: 769px) and (max-width: 1024px) {
            #controlPanel {
                width: 280px;
                padding: 12px;
            }

            h1 {
                font-size: 17px;
            }
        }

        /* 작은 모바일 */
        @media (max-width: 480px) {
            #controlPanel {
                width: 90%;
                max-width: 280px;
            }

            .stats-grid {
                gap: 6px;
            }

            .stat-box {
                padding: 6px;
            }

            .stat-number {
                font-size: 16px;
            }

            .stat-label {
                font-size: 9px;
            }
        }

        /* 닫기 버튼 (모바일용) */
        #closePanel {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 69, 0, 0.5);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 101;
        }

        @media (max-width: 768px) {
            #closePanel {
                display: block;
            }
        }
    </style>
</head>
<body>
    <button id="menuToggle">☰</button>

    <div id="container">
        <div id="controlPanel">
            <button id="closePanel">×</button>
            <h1>🌍 Global Earthquake Monitor</h1>
            <div class="subtitle">실시간 세계 지진 3D 시각화</div>

            <div class="section">
                <div class="section-title">통계 (최근 7일)</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-number" id="totalCount">-</div>
                        <div class="stat-label">총 지진 수</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="maxMagnitude">-</div>
                        <div class="stat-label">최대 규모</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="todayCount">-</div>
                        <div class="stat-label">오늘</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="majorCount">-</div>
                        <div class="stat-label">규모 6.0+</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">최근 지진 TOP 10</div>
                <div id="recentEarthquakes"></div>
            </div>

            <div class="section">
                <div class="section-title">범례</div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FF0000;"></div>
                        <span>최근 1시간</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FFA500;"></div>
                        <span>최근 1일</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FFFF00;"></div>
                        <span>최근 1주일</span>
                    </div>
                    <div class="legend-item">
                        <span style="font-size: 18px;">💥</span>
                        <span>크기 = 지진 규모</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">컨트롤</div>
                <button class="control-btn" id="refreshBtn">🔄 데이터 새로고침</button>
                <button class="control-btn" id="pauseBtn">⏸ 회전 일시정지</button>
                <button class="control-btn" id="resetBtn">🔄 카메라 리셋</button>
            </div>

            <div class="section">
                <div class="section-title">정보</div>
                <div style="font-size: 10px; opacity: 0.7; line-height: 1.5;">
                    <p><span class="ring-of-fire">환태평양 화산대</span>에서 전 세계 지진의 약 90%가 발생합니다.</p>
                    <p style="margin-top: 8px;">데이터: USGS (미국 지질조사국)</p>
                    <p>업데이트: 5분마다 자동</p>
                    <p>비용: 100% 무료</p>
                </div>
            </div>
        </div>

        <div id="canvas-container">
            <div id="loadingIndicator">🔄 Loading...</div>
            <div id="tooltip"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        let scene, camera, renderer, controls;
        let earth, earthquakes = [];
        let isPaused = false;
        let animationTime = 0;
        let raycaster, mouse;
        let earthquakeData = [];

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Camera
            const container = document.getElementById('canvas-container');
            camera = new THREE.PerspectiveCamera(
                60,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 150);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 60;
            controls.maxDistance = 300;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.enablePan = false;

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1.5, 300);
            pointLight.position.set(100, 100, 100);
            scene.add(pointLight);

            // Create Earth
            createEarth();

            // Create starfield
            createStarfield();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('click', onClick);

            // Touch events for mobile
            renderer.domElement.addEventListener('touchstart', onTouchStart);
            renderer.domElement.addEventListener('touchmove', onTouchMove);

            // UI setup
            setupUI();

            // Fetch earthquake data
            fetchEarthquakeData();

            // Auto-refresh every 5 minutes
            setInterval(fetchEarthquakeData, 5 * 60 * 1000);

            // Animation loop
            animate();
        }

        function createEarth() {
            const geometry = new THREE.SphereGeometry(50, 64, 64);

            const material = new THREE.MeshPhongMaterial({
                color: 0x1a4d2e,
                emissive: 0x0a1f16,
                shininess: 5,
                transparent: true,
                opacity: 0.9
            });

            earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            // Add atmosphere glow
            const atmosphereGeometry = new THREE.SphereGeometry(52, 64, 64);
            const atmosphereMaterial = new THREE.MeshPhongMaterial({
                color: 0x4a90e2,
                transparent: true,
                opacity: 0.1,
                side: THREE.BackSide
            });
            const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            earth.add(atmosphere);

            // Add grid lines
            const gridMaterial = new THREE.LineBasicMaterial({
                color: 0x3a7a5a,
                transparent: true,
                opacity: 0.3
            });

            // Latitude lines
            for (let i = -80; i <= 80; i += 20) {
                const phi = (90 - i) * Math.PI / 180;
                const points = [];
                for (let j = 0; j <= 360; j += 10) {
                    const theta = j * Math.PI / 180;
                    const x = 50.5 * Math.sin(phi) * Math.cos(theta);
                    const y = 50.5 * Math.cos(phi);
                    const z = 50.5 * Math.sin(phi) * Math.sin(theta);
                    points.push(new THREE.Vector3(x, y, z));
                }
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeometry, gridMaterial);
                earth.add(line);
            }

            // Longitude lines
            for (let i = 0; i < 360; i += 30) {
                const points = [];
                for (let j = -90; j <= 90; j += 5) {
                    const phi = (90 - j) * Math.PI / 180;
                    const theta = i * Math.PI / 180;
                    const x = 50.5 * Math.sin(phi) * Math.cos(theta);
                    const y = 50.5 * Math.cos(phi);
                    const z = 50.5 * Math.sin(phi) * Math.sin(theta);
                    points.push(new THREE.Vector3(x, y, z));
                }
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeometry, gridMaterial);
                earth.add(line);
            }
        }

        function createStarfield() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.7,
                transparent: true,
                opacity: 0.8
            });

            const starsVertices = [];
            for (let i = 0; i < 3000; i++) {
                const x = (Math.random() - 0.5) * 1000;
                const y = (Math.random() - 0.5) * 1000;
                const z = (Math.random() - 0.5) * 1000;
                starsVertices.push(x, y, z);
            }

            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        function latLonToVector3(lat, lon, radius = 50) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = (lon + 180) * Math.PI / 180;

            const x = -radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            return new THREE.Vector3(x, y, z);
        }

        async function fetchEarthquakeData() {
            const loading = document.getElementById('loadingIndicator');
            loading.classList.add('show');

            try {
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson');
                const data = await response.json();

                earthquakeData = data.features.map(feature => ({
                    magnitude: feature.properties.mag,
                    place: feature.properties.place,
                    time: new Date(feature.properties.time),
                    lat: feature.geometry.coordinates[1],
                    lon: feature.geometry.coordinates[0],
                    depth: feature.geometry.coordinates[2],
                    id: feature.id
                }));

                earthquakeData.sort((a, b) => b.magnitude - a.magnitude);

                updateStatistics();
                updateEarthquakeList();
                createEarthquakeMarkers();

                console.log(`✅ Loaded ${earthquakeData.length} earthquakes`);
            } catch (error) {
                console.error('❌ Failed to fetch earthquake data:', error);
            } finally {
                loading.classList.remove('show');
            }
        }

        function createEarthquakeMarkers() {
            earthquakes.forEach(eq => earth.remove(eq));
            earthquakes = [];

            const now = Date.now();

            earthquakeData.forEach(eq => {
                const ageHours = (now - eq.time.getTime()) / (1000 * 60 * 60);

                let color;
                if (ageHours < 1) {
                    color = new THREE.Color(0xFF0000);
                } else if (ageHours < 24) {
                    color = new THREE.Color(0xFFA500);
                } else {
                    color = new THREE.Color(0xFFFF00);
                }

                const size = Math.pow(2, eq.magnitude - 4) * 0.8;

                const geometry = new THREE.SphereGeometry(size, 16, 16);
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.8
                });

                const marker = new THREE.Mesh(geometry, material);

                const pos = latLonToVector3(eq.lat, eq.lon, 50.5);
                marker.position.copy(pos);

                const glowGeometry = new THREE.SphereGeometry(size * 1.5, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                marker.add(glow);

                marker.userData = eq;

                earth.add(marker);
                earthquakes.push(marker);
            });
        }

        function updateStatistics() {
            const now = Date.now();
            const oneDayAgo = now - (24 * 60 * 60 * 1000);

            const todayEarthquakes = earthquakeData.filter(eq => eq.time.getTime() > oneDayAgo);
            const majorEarthquakes = earthquakeData.filter(eq => eq.magnitude >= 6.0);
            const maxMag = earthquakeData.length > 0 ? earthquakeData[0].magnitude : 0;

            document.getElementById('totalCount').textContent = earthquakeData.length;
            document.getElementById('maxMagnitude').textContent = maxMag.toFixed(1);
            document.getElementById('todayCount').textContent = todayEarthquakes.length;
            document.getElementById('majorCount').textContent = majorEarthquakes.length;
        }

        function updateEarthquakeList() {
            const container = document.getElementById('recentEarthquakes');
            container.innerHTML = '';

            const top10 = earthquakeData.slice(0, 10);

            top10.forEach(eq => {
                const item = document.createElement('div');
                const mag = Math.floor(eq.magnitude);
                item.className = `earthquake-item magnitude-${mag}`;

                const timeAgo = getTimeAgo(eq.time);

                item.innerHTML = `
                    <div>
                        <span class="eq-magnitude">${eq.magnitude.toFixed(1)}</span>
                        <span style="font-weight: bold;">${eq.place}</span>
                    </div>
                    <div class="eq-time">${timeAgo} - Depth: ${eq.depth.toFixed(0)}km</div>
                `;

                item.onclick = () => {
                    focusOnEarthquake(eq);
                    if (window.innerWidth <= 768) {
                        closePanel();
                    }
                };
                container.appendChild(item);
            });
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

            if (seconds < 60) return `${seconds}초 전`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}분 전`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}시간 전`;
            return `${Math.floor(seconds / 86400)}일 전`;
        }

        function focusOnEarthquake(eq) {
            const targetPos = latLonToVector3(eq.lat, eq.lon, 50);
            const distance = 100;

            // Calculate camera position looking at the earthquake from outside
            const direction = targetPos.clone().normalize();
            const cameraPos = direction.multiplyScalar(distance);

            // Smooth transition
            const duration = 1000;
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const startTime = Date.now();

            function animateCamera() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = progress < 0.5
                    ? 2 * progress * progress
                    : -1 + (4 - 2 * progress) * progress;

                camera.position.lerpVectors(startPos, cameraPos, eased);
                controls.target.lerpVectors(startTarget, targetPos, eased);

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }

            animateCamera();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                animationTime += 0.016;

                earthquakes.forEach((marker, idx) => {
                    const pulse = 1.0 + Math.sin(animationTime * 3 + idx * 0.5) * 0.2;
                    if (marker.children[0]) {
                        marker.children[0].scale.set(pulse, pulse, pulse);
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        let touchStartTime = 0;
        let touchStartPos = { x: 0, y: 0 };

        function onTouchStart(event) {
            if (event.touches.length === 1) {
                touchStartTime = Date.now();
                touchStartPos.x = event.touches[0].clientX;
                touchStartPos.y = event.touches[0].clientY;
            }
        }

        function onTouchMove(event) {
            if (event.touches.length === 1) {
                const deltaX = Math.abs(event.touches[0].clientX - touchStartPos.x);
                const deltaY = Math.abs(event.touches[0].clientY - touchStartPos.y);

                // If moved more than 10px, it's a pan gesture, not a tap
                if (deltaX > 10 || deltaY > 10) {
                    touchStartTime = 0;
                }
            }
        }

        function onMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            updateTooltip(event.clientX, event.clientY);
        }

        function updateTooltip(clientX, clientY) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(earthquakes);

            const tooltip = document.getElementById('tooltip');

            if (intersects.length > 0) {
                const eq = intersects[0].object.userData;

                if (eq && eq.magnitude) {
                    tooltip.style.display = 'block';
                    tooltip.style.left = clientX + 15 + 'px';
                    tooltip.style.top = clientY + 15 + 'px';

                    tooltip.innerHTML = `
                        <div class="tooltip-magnitude">규모 ${eq.magnitude.toFixed(1)}</div>
                        <div class="tooltip-info">
                            <strong>${eq.place}</strong><br>
                            깊이: ${eq.depth.toFixed(0)}km<br>
                            ${getTimeAgo(eq.time)}
                        </div>
                    `;

                    renderer.domElement.style.cursor = 'pointer';
                } else {
                    tooltip.style.display = 'none';
                    renderer.domElement.style.cursor = 'default';
                }
            } else {
                tooltip.style.display = 'none';
                renderer.domElement.style.cursor = 'default';
            }
        }

        function onClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(earthquakes);

            if (intersects.length > 0) {
                const eq = intersects[0].object.userData;
                if (eq && eq.magnitude) {
                    focusOnEarthquake(eq);
                }
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function setupUI() {
            // Mobile menu toggle
            const menuToggle = document.getElementById('menuToggle');
            const closePanel = document.getElementById('closePanel');
            const controlPanel = document.getElementById('controlPanel');

            function openPanel() {
                controlPanel.classList.add('open');
            }

            function closePanel() {
                controlPanel.classList.remove('open');
            }

            menuToggle.addEventListener('click', openPanel);
            closePanel.addEventListener('click', closePanel);

            // Close panel when clicking outside on mobile
            document.getElementById('canvas-container').addEventListener('click', (e) => {
                if (window.innerWidth <= 768 && controlPanel.classList.contains('open')) {
                    if (!controlPanel.contains(e.target)) {
                        closePanel();
                    }
                }
            });

            window.closePanel = closePanel; // Make it accessible

            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', fetchEarthquakeData);

            // Pause button
            document.getElementById('pauseBtn').addEventListener('click', function() {
                isPaused = !isPaused;
                controls.autoRotate = !isPaused;
                this.textContent = isPaused ? '▶️ 회전 재개' : '⏸ 회전 일시정지';
            });

            // Reset button
            document.getElementById('resetBtn').addEventListener('click', function() {
                camera.position.set(0, 0, 150);
                controls.target.set(0, 0, 0);
                controls.reset();
            });
        }

        // Initialize
        init();
    </script>
</body>
</html>
